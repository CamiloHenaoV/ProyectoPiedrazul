server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Identity & Access
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/api/auth/**

        # User Management
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

        # Scheduling
        - id: scheduling-service
          uri: lb://scheduling-service
          predicates:
            - Path=/api/scheduling/**

        # Notifications
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

        # Todo lo demás va al monolito mientras migras
        - id: monolith
          uri: http://localhost:8090
          predicates:
            - Path=/api/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true